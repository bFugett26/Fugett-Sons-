<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fugett & Sons Painting and Drywall | Request Estimate</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="index.html">Fugett & Sons Painting and Drywall</a>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="reviews.html">Reviews</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a class="active" href="estimate.html">Request Estimate</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="hero card">
        <h1>Request an Estimate</h1>
        <form id="estimateForm">
          <label for="name">Name</label>
          <input id="name" name="name" required />

          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="serviceType">Type of service requested</label>
          <select id="serviceType" name="serviceType" required>
            <option value="">Select one</option>
            <option value="Residential">Residential</option>
            <option value="Commercial">Commercial</option>
            <option value="Other">Other</option>
          </select>

          <div id="residentialGroup" class="hidden">
            <label for="residentialType">Residential service type</label>
            <select id="residentialType" name="residentialType">
              <option value="">Select one</option>
              <option value="Exterior">Exterior</option>
              <option value="Interior">Interior</option>
            </select>
          </div>

          <div id="exteriorGroup" class="hidden">
            <label for="exteriorType">Exterior options</label>
            <select id="exteriorType" name="exteriorType">
              <option value="">Select one</option>
              <option value="Exterior walls">Exterior walls</option>
              <option value="Exterior Doors">Exterior Doors</option>
              <option value="Patio Furniture">Patio Furniture</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div id="interiorGroup" class="hidden">
            <label for="interiorType">Interior options</label>
            <select id="interiorType" name="interiorType">
              <option value="">Select one</option>
              <option value="Room">Room</option>
              <option value="Walls">Walls</option>
              <option value="Ceilings">Ceilings</option>
              <option value="Stair Railings">Stair Railings</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div id="roomSqftGroup" class="hidden">
            <label for="roomSqft">Room square feet</label>
            <input id="roomSqft" name="roomSqft" type="number" min="1" placeholder="Enter room sq ft" />
          </div>

          <label for="details">Project details</label>
          <textarea id="details" name="details" placeholder="Please describe what you need done"></textarea>

          <button class="btn" type="submit">Submit</button>
        </form>

        <p id="thankYouNotice" class="notice hidden">
          Thank you for requesting an estimate. We will contact you within 24 hours to schedule your estimate.
        </p>
      </section>
    </main>

    <footer>© Fugett & Sons Painting and Drywall</footer>
    <script src="script.js"></script>
  </body>
</html>
